name: Build Wire Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - desktop-windows-app

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build and package Wire
        run: npm run desktop:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Wire-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
